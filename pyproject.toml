[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "part11-eval-evidence"
version = "0.1.0"
description = "Turn an LLM eval run into an audit-ready evidence package (hash-chained log, traceability matrix, validation summary) informed by FDA 21 CFR Part 11."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ravin Elango"}]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
p11e = "part11_eval_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
